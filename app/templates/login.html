{% extends "base.html" %}

{% block titulo %}Entrar — Painel SUAS{% endblock %}

{% block head_extra %}
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.97.0"></script>
{% endblock %}

{% block body %}
<main class="tela-login">
  <form id="form-login" class="cartao-login">
    <h1>Painel SUAS</h1>
    <p class="subtitulo">Acesso de gestores municipais</p>

    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="username" />

    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" required autocomplete="current-password" />

    <button type="submit">Entrar</button>

    <p id="mensagem-erro" class="mensagem-erro" hidden></p>
  </form>
</main>

<script>
  const SUPABASE_URL = {{ supabase_url | tojson }};
  const SUPABASE_ANON_KEY = {{ supabase_anon_key | tojson }};
</script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
