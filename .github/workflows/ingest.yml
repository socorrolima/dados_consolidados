name: Ingestão de dados (SAGI/MDS)

on:
  schedule:
    - cron: "0 6 * * *" # diário, 06h UTC
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset a ingerir (vazio = todos, usado no cron diário)"
        required: false
        type: choice
        options:
          - ""
          - misocial
          - misocial_mes_estado
      uf:
        description: "UFs separadas por vírgula"
        required: true
        default: "BA,PE,RN"
      competencia:
        description: "AAAAMM ou 'latest'"
        required: true
        default: "latest"

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m scripts.seed_municipios
      - run: python -m scripts.seed_indicadores
      - name: Ingerir misocial (município/mês)
        if: github.event_name == 'schedule' || github.event.inputs.dataset == '' || github.event.inputs.dataset == 'misocial'
        run: >-
          python -m ingestion.run_ingestion
          --dataset misocial
          --uf ${{ github.event.inputs.uf || 'BA,PE,RN' }}
          --competencia ${{ github.event.inputs.competencia || 'latest' }}
      - name: Ingerir misocial_mes_estado (estado/mês)
        if: github.event_name == 'schedule' || github.event.inputs.dataset == '' || github.event.inputs.dataset == 'misocial_mes_estado'
        run: >-
          python -m ingestion.run_ingestion
          --dataset misocial_mes_estado
          --uf ${{ github.event.inputs.uf || 'BA,PE,RN' }}
          --competencia ${{ github.event.inputs.competencia || 'latest' }}
